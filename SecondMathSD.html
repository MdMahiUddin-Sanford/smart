<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;background:linear-gradient(#7fd8ff,#c9f0ff 60%,#b8f08a 60%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cloud{position:fixed;font-size:70px;animation:drift 30s linear infinite;opacity:.9}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}
.card{position:relative;z-index:2;background:#fff;border:6px solid #ffb703;border-radius:32px;padding:20px;width:min(660px,94vw);max-height:98vh;overflow:auto;text-align:center;box-shadow:0 12px 0 #fb8500,0 20px 40px rgba(0,0,0,.25)}
h1{margin:0 0 6px;color:#e63946;font-size:2.2rem}
.btn{font:inherit;font-size:1.3rem;font-weight:bold;color:#fff;background:#06d6a0;border:none;border-radius:20px;padding:10px 26px;cursor:pointer;box-shadow:0 6px 0 #049a75;margin:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #049a75}
.home{background:#8d99ae;box-shadow:0 6px 0 #5c677d}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{font:inherit;font-weight:bold;font-size:1.1rem;color:#fff;border:none;border-radius:18px;padding:12px 8px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);line-height:1.25;text-decoration:none;display:block}
.tile span{font-size:2.2rem;display:block}
.tile small{display:block;font-size:.78rem;font-weight:normal;opacity:.95}
.tile:hover{transform:scale(1.04)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile:last-child:nth-child(odd){grid-column:span 2}
.hud{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:bold;color:#444;margin-bottom:8px;gap:6px}
.bar{height:18px;background:#eee;border-radius:12px;overflow:hidden;margin-bottom:12px}
.bar div{height:100%;width:100%;background:#06d6a0;transition:width .1s linear,background .3s}
.qbox{font-size:1.5rem;font-weight:bold;color:#222;margin:8px 0;line-height:1.35}
.qbox svg{max-width:100%;height:auto}
.read{font-size:1.4rem;background:#fff;border:3px solid #ffb703;border-radius:50%;width:46px;height:46px;cursor:pointer;vertical-align:middle;margin-left:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.opt{font:inherit;font-size:1.35rem;font-weight:bold;color:#fff;border:none;border-radius:20px;padding:14px 8px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);word-break:break-word}
.opt:nth-child(1){background:#ef476f}.opt:nth-child(2){background:#118ab2}.opt:nth-child(3){background:#9b5de5}.opt:nth-child(4){background:#f77f00}
.opt.right,.chip.right{background:#06d6a0!important;animation:pop .4s}
.opt.wrong{background:#555!important;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{min-height:2.2rem;font-size:1.2rem;font-weight:bold;margin-top:10px}
input.ans{font:inherit;font-size:1.8rem;text-align:center;width:90%;max-width:360px;padding:10px;border:4px solid #118ab2;border-radius:18px;outline:none}
.slotrow,.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;min-height:56px}
.slotrow{background:#eef7ff;border:3px dashed #118ab2;border-radius:16px;padding:8px}
.chip{font:inherit;font-size:1.3rem;font-weight:bold;color:#fff;background:#118ab2;border:none;border-radius:14px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.chip.used{opacity:.25;pointer-events:none}
.letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.letters b{background:#ffd6e0;color:#d00060;border-radius:10px;padding:6px 12px;font-size:1.8rem}
.bigico{font-size:5rem}
.snd{position:fixed;top:12px;right:12px;z-index:5}
.snd button{font-size:1.5rem;width:50px;height:50px;border-radius:50%;border:4px solid #ffb703;background:#fff;cursor:pointer;box-shadow:0 4px 0 #fb8500}
.snd button.off{opacity:.45;filter:grayscale(1)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.mt button{font:bold 1.05rem Arial,sans-serif;padding:12px 6px;border:3px solid #cbb8ff;border-radius:14px;background:#fff;color:#333;cursor:pointer}.mt button.sel{background:#ffe08a;border-color:#ffb703}.mt button.done{background:#c8f7dc;border-color:#06d6a0;opacity:.7}.mt button.bad{animation:shk .3s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="cloud" style="top:5%">☁️</div>
<div class="cloud" style="top:20%;animation-delay:-12s">☁️</div>
<div class="cloud" style="top:35%;animation-delay:-22s">☁️</div>
<div class="snd"><button id="sndBtn" title="Sound and voice" onclick="toggleSnd()">🔊</button></div>

<div class="card">
  <div id="home">
    <div class="bigico">📚🦉</div>
    <h1>Second Math SD 🧮</h1>
    <p style="margin:4px;font-size:1.1rem"><b>Practice time. Pick a subject!</b></p>
    <div class="grid" id="subjects"></div>
    <a class="btn home" href="Mahtab.html" style="text-decoration:none;display:inline-block">⬅ Mahtab</a>
  </div>

  <div id="topics" class="hidden">
    <h1 id="subTitle"></h1>
    <p style="margin:4px;font-size:1.1rem">10 questions each. <b>Choose a topic:</b></p>
    <div class="grid" id="topicGrid"></div>
    <button class="btn home" onclick="show('home')">⬅ Back</button>
  </div>

  <div id="game" class="hidden">
    <div class="hud"><span>Q <span id="qn">1</span>/10</span><span id="tname"></span><span>⏱ <span id="time">30</span>s</span><span>⭐ <span id="score">0</span></span></div>
    <div class="bar"><div id="bar"></div></div>

  </div>

  <div id="end" class="hidden">
    <div class="bigico" id="trophy">🏆</div>
    <h1>Well done!</h1><div id="endt" style="font-size:1.1rem;font-weight:bold"></div>
    <div style="font-size:2.6rem" id="stars"></div>
    <p style="font-size:1.8rem;margin:6px">You scored <b id="final"></b> / 10</p>
    <p style="font-size:1.2rem" id="comment"></p>
    <button class="btn" onclick="startTopic(curTopic)">🔄 Play Again</button>
    <button class="btn home" onclick="openSubject(curSub)">📋 Topics</button>
    <button class="btn home" onclick="show('home')">🏠 Home</button>
  </div>
</div>

<script>
const TOTAL=10;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const L=s=>s.trim().split('\n').map(x=>x.trim()).filter(Boolean);

/* ---------- sound + voice ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac,sndOn=true,unlocked=false;
function ctx(){try{ac=ac||new AC();if(ac.state!=='running')ac.resume();return ac}catch(e){return null}}
function silentUrl(){
  const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,22050,true);v.setUint32(28,44100,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function unlock(){
  const a=ctx();if(!a)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(unlocked)return;
  try{const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}catch(e){}
  try{const el=new Audio(silentUrl());el.loop=true;el.volume=.01;const p=el.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  if(a.state==='running')unlocked=true;
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function tone(f,d,type='sine',vol=.15,delay=0){
  const a=ctx();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  click(){if(sndOn)tone(700,.08,'triangle',.12)},
  good(){if(sndOn)[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.09))},
  bad(){if(sndOn){tone(300,.25,'sawtooth',.1);tone(200,.4,'sawtooth',.1,.18)}},
  tick(){if(sndOn)tone(1000,.06,'square',.06)},
  end(s){if(sndOn)(s>=2?[523,659,784,1047,784,1047,1319]:s===1?[523,659,784,659,784]:[784,659,523]).forEach((f,i)=>tone(f,.3,'triangle',.18,i*.13))}
};
function say(t){
  if(!sndOn||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.1;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}
}
const plain=h=>h.replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<br>/g,'. ').replace(/<[^>]+>/g,'').replace(/___/g,'blank').replace(/\s+/g,' ').trim();
function toggleSnd(){ctx();sndOn=!sndOn;$('sndBtn').textContent=sndOn?'🔊':'🔇';$('sndBtn').classList.toggle('off',!sndOn);if(!sndOn&&window.speechSynthesis)speechSynthesis.cancel();else sfx.click()}
document.addEventListener('click',e=>{if(e.target.closest('.tile,.btn'))sfx.click()});

/* ---------- generic builders ---------- */
function bankMC(lines,o={}){
  let deck=[];
  return()=>{
    if(!deck.length)deck=shuf(lines);
    const [q,a,...w]=deck.pop().split('|');
    const set=new Set([a]);
    shuf(w).forEach(x=>{if(set.size<4)set.add(x)});
    if(o.fill!==false)for(const l of shuf(lines)){if(set.size>=4)break;const x=l.split('|')[1];if(x!==a)set.add(x)}
    return{t:'mc',q,a,opts:shuf([...set])};
  };
}
function fixedMC(pairs,opts,qf){
  let deck=[];
  return()=>{if(!deck.length)deck=shuf(pairs);const [x,a]=deck.pop();return{t:'mc',q:qf(x),a,opts:[...opts],say:null}};
}

/* ---------- SPELLING ---------- */
const W2=`about after again all always animal any around ask away back because been before best big black blue boy bring brown call came carry clean cold color come could day dear does done door down draw drink each early eat every fall far fast find first five fly food four friend from funny gave girl give going good great green grow happy have help here home house jump keep kind know last left light little long look made make many more much must name never night now off old once only open over own pick play please pretty pull put read right round said saw see seven should sing sit sleep small some soon stop take tell thank that their them then these they think this today together tree under upon use very walk want warm wash water week were what when where which white who why will wish with work would write year yellow your`.split(/\s+/);
const W3=`able across against also answer area asked balloon basket beautiful believe beside between bicycle birthday body bottom bought breakfast bright brother build busy button candy captain careful castle cause center certain change chicken children circle city class climb clothes cloud country cousin crowd daughter decide different dinner discover doctor dollar double during earth enough evening everyone exercise explain family favorite finally flower follow forest forget forward garden gentle giant glass ground group guess guide half happen heavy history hospital hundred hungry idea important island jewel journey kitchen knew knife knock ladder laugh learn leave library listen machine marble measure medicine middle minute mirror money monkey morning mountain mouth moving music nature neighbor nothing notice number ocean office orange paper parent party people picture piece planet pocket police potato probably problem promise purple question quick quiet quite rabbit reason remember return river rocket school science second secret shadow shoulder simple sister smooth snowman someone special spring square station stomach straight strange street strong summer surprise sweater table teacher terrible thousand through thunder tomorrow touch toward travel trouble truck turtle uncle unhappy until usual vacation valley village visit voice weather weight whale whisper window winter wonder world wrong young`.split(/\s+/);
const ALLW=new Set([...W2,...W3]);
const WALL=[...ALLW];
function misspell(w){
  const out=new Set();let t=0;
  while(out.size<3&&t++<80){
    const s=w.split(''),r=rnd(0,4),i=rnd(1,s.length-1);
    if(r===0&&s.length>3)[s[i-1],s[i]]=[s[i],s[i-1]];
    else if(r===1&&s.length>3)s.splice(i,1);
    else if(r===2)s.splice(i,0,s[i-1]);
    else if(r===3){const idx=s.map((c,k)=>'aeiou'.includes(c)?k:-1).filter(k=>k>=0);if(idx.length){const k=pick(idx);s[k]=pick('aeiou'.split('').filter(x=>x!==s[k]))}}
    else s.splice(i,0,pick('aeiou'.split('')));
    const m=s.join('');if(m!==w&&!ALLW.has(m))out.add(m);
  }
  let k=0;while(out.size<3)out.add(w+'e'.repeat(++k));
  return[...out];
}
function wordDeck(list){let d=[];return()=>{if(!d.length)d=shuf(list);return d.pop()}}
const spellRight=list=>{const nx=wordDeck(list);return()=>{const w=nx();return{t:'mc',q:'Which is spelled <b>correctly</b>?',a:w,opts:shuf([w,...misspell(w)]),say:'Which is spelled correctly?'}}};
const spellListen=list=>{const nx=wordDeck(list);return()=>{const w=nx();return{t:'type',q:'👂 Listen and <b>type the word</b>',a:w,speakWord:w,say:w}}};
const spellScramble=list=>{const nx=wordDeck(list.filter(w=>w.length>=4));return()=>{const w=nx();let s=w;for(let i=0;i<20&&s===w;i++)s=shuf(w.split('')).join('');return{t:'type',q:'Unscramble the letters:<div class="letters">'+s.split('').map(c=>`<b>${c.toUpperCase()}</b>`).join('')+'</div>',a:w,say:'Unscramble the letters. '+s.split('').join(', ')}}};

/* ---------- SECOND ENGLISH (SFSD 2nd grade ELA) ---------- */
const bankType=lines=>{let d=[];return()=>{if(!d.length)d=shuf(lines);const [q,a]=d.pop().split('|');return{t:'type',q,a:a.toLowerCase()}}};
const bankBuild=(list,prompt)=>{let d=[];return()=>{if(!d.length)d=shuf(list);const s=d.pop(),w=s.split(' ');let t=shuf(w);for(let i=0;i<10&&t.join(' ')===s;i++)t=shuf(w);return{t:'build',q:prompt||'Tap the words in the right order 🧩',words:t,a:s,say:prompt||'Put the words in the right order.'}}};
const bankMatch=(lines,title)=>{let d=[];return()=>{if(d.length<4)d=shuf(lines);const ps=d.splice(0,4).map(x=>x.split('='));return{t:'match',q:title,pairs:ps,a:ps.map(p=>p[0]+' = '+p[1]).join(', '),say:title}}};
const PS=(passage,qas)=>qas.map(x=>`<i>${passage}</i><br>${x}`);
const ALLQ=(...arrs)=>arrs.flat();

/* ===== 1. READING STORIES ===== */
/* ===== MATH CONTENT (A) ===== */
const mc=s=>bankMC(L(s),{fill:false});
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENSW=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const nw=n=>n<20?ONES[n]:n<100?TENSW[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:''):n===1000?'one thousand':ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+nw(n%100):'');
const nopts=(a,extra=[])=>{const s=[a];const add=x=>{if(x>=0&&!s.includes(x)&&s.length<4)s.push(x)};shuf(extra).forEach(add);shuf([1,-1,10,-10,2,-2,5,-5,3,-3,20,-20]).forEach(d=>add(a+d));return s};
const NQ=(q,a,extra=[],o={})=>({t:'mc',q,a:String(a),opts:shuf(nopts(a,extra).map(String)),...o});
const TQ=(q,a)=>({t:'type',q,a:String(a)});
const OPT=(q,a,wrong)=>{const w=[...new Set(wrong.map(String))].filter(x=>x!==String(a));return{t:'mc',q,a:String(a),opts:shuf([String(a),...shuf(w).slice(0,3)])}};
const NAMES=['Mia','Sam','Ava','Leo','Zoe','Max','Ella','Noah','Lily','Ben'];
const ITEMS=['stickers','marbles','cards','cookies','pencils','books','shells','stamps'];
const twoN=()=>{const n=pick(NAMES);let m=pick(NAMES);while(m===n)m=pick(NAMES);return[n,m]};

/* ---- counting ---- */
const M_SKIP=()=>{
  const s=pick([2,5,10,10,100]);let t0;
  if(s===2)t0=2*rnd(0,20);else if(s===5)t0=5*rnd(0,20);else if(s===10)t0=rnd(0,90);else t0=rnd(0,5)*100;
  if(s===100&&rnd(0,2)===0)t0=rnd(0,500);
  const f=[0,1,2,3,4].map(i=>t0+i*s);
  const back=rnd(0,1)===1;const seq=back?[...f].reverse():f;
  const hole=rnd(0,1)?4:rnd(1,3);const ans=seq[hole];
  const shown=seq.map((v,i)=>i===hole?'▢':v).join(', ');
  return NQ(`Count ${back?'<b>backward</b> ':''}by <b>${s}s</b>:<br><b>${shown}</b>`,ans,[ans+s,ans-s,ans+1,ans-1]);
};
const M_ODD=()=>{
  const k=rnd(0,3);
  if(k===0){const ev=2*rnd(1,25);const od=[];while(od.length<3){const x=2*rnd(0,24)+1;if(!od.includes(x))od.push(x)}return OPT('Which number is <b>even</b>?',ev,od)}
  if(k===1){const od=2*rnd(0,24)+1;const ev=[];while(ev.length<3){const x=2*rnd(1,25);if(!ev.includes(x))ev.push(x)}return OPT('Which number is <b>odd</b>?',od,ev)}
  const n=rnd(3,13),em=pick(['⭐','🍎','🐞','🎈']);
  const ev=n%2===0;
  return{t:'mc',q:`Make pairs of ${em}. Are there any left over?<br><span style="font-size:1.6rem">${em.repeat(n)}</span>`,a:ev?'Even: no one left over':'Odd: 1 left over',opts:shuf(['Even: no one left over','Odd: 1 left over','Even: 1 left over','Odd: no one left over'])};
};
const M_COUNTBANK=mc(`
When you count by 2s you say numbers that are…|even|odd|all different|backward only
Counting by 5s, the ones digit is always 0 or…|5|2|3|7
Counting by 10s, the ones digit…|stays the same|goes up by 1|goes down by 1|is always 5
Counting by 100s from 300 you say 300, 400, 500, and then…|600|510|501|550
An even number can be split into two equal…|groups or pairs|odd numbers|rows only|tens
An odd number always has…|one left over when making pairs|no left over|two left over|three left over
The numbers 2, 4, 6, 8 and 10 are…|even|odd|prime|tens
The numbers 1, 3, 5, 7 and 9 are…|odd|even|tens|hundreds
Even numbers end in 0, 2, 4, 6, or…|8|9|7|5
Odd numbers end in 1, 3, 5, 7, or…|9|8|6|4
Which pattern counts by 5s?|5, 10, 15, 20|2, 4, 6, 8|10, 20, 30, 40|3, 6, 9, 12
Which pattern counts by 2s?|2, 4, 6, 8|5, 10, 15, 20|10, 20, 30, 40|1, 3, 5, 7
Which pattern counts by 10s?|10, 20, 30, 40|2, 4, 6, 8|5, 10, 15, 20|1, 2, 3, 4
Counting by 5s to 120. Which number comes right after 115?|120|116|125|130
Counting by 2s to 50. What comes right before 50?|48|49|52|40
Counting backward by 10s from 100, what is next after 100?|90|110|99|80`);

/* ---- place value ---- */
const M_NEXT=()=>{
  const three=rnd(0,1)===1;
  if(!three){const n=rnd(11,98);if(n%10===0)return M_NEXT();
    return rnd(0,1)?NQ(`How far is <b>${n}</b> to the <b>next ten</b>?<br>(${n} + ▢ = ${n+10-n%10})`,10-n%10,[n%10,10-n%10+10]):NQ(`How far is <b>${n}</b> back to the <b>prior ten</b>?<br>(${n} − ▢ = ${n-n%10})`,n%10,[10-n%10,n%10+10]);}
  const n=rnd(101,998);if(n%100===0)return M_NEXT();
  return rnd(0,1)?NQ(`How far is <b>${n}</b> to the <b>next hundred</b>?<br>(${n} + ▢ = ${n+100-n%100})`,100-n%100,[n%100,100-n%100+10,100-n%100-10]):NQ(`How far is <b>${n}</b> back to the <b>prior hundred</b>?<br>(${n} − ▢ = ${n-n%100})`,n%100,[100-n%100,n%100+10,n%100-10]);
};
const blocks=(h,t,o)=>`<span style="font-size:1.4rem;letter-spacing:2px">${'🟥'.repeat(h)} ${'🟦'.repeat(t)} ${'🟩'.repeat(o)}</span><br><small>🟥 = 100 &nbsp; 🟦 = 10 &nbsp; 🟩 = 1</small>`;
const M_COMP=()=>{
  const h=rnd(1,5),t=rnd(1,6),o=rnd(1,6),n=h*100+t*10+o;const k=rnd(0,4);
  if(k===0)return NQ(`${h} hundreds + ${t} tens + ${o} ones = ▢`,n,[h*100+o*10+t,t*100+h*10+o,h+t+o]);

  let pts=[];const off=Math.PI/n*(n%2?1:0.5)*0+(-Math.PI/2);
  for(let i=0;i<n;i++){const a=off+i*2*Math.PI/n+(reg?0:(Math.random()-.5)*0.6),r=reg?42:rnd(24,46);pts.push([(55+r*Math.cos(a)).toFixed(1),(55+r*Math.sin(a)).toFixed(1)])}
  return `<svg width="120" height="120" viewBox="0 0 110 110" style="vertical-align:middle"><polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${col||'#9b5de5'}" fill-opacity=".8" stroke="#333" stroke-width="3"/></svg>`;
};

  clearInterval(timer);left=LIMIT;lastTick=-1;upd();

  const t=Math.max(0,left);$('time').textContent=Math.ceil(t);

  s.onclick=()=>{if(locked)return;cur.picked=cur.picked.filter(x=>x!==i);s.remove();$('w'+i).classList.remove('used')};

function matchPick(b,o){
  if(locked||!cur.sel||b.classList.contains('done'))return;
  if(cur.pairs[cur.sel.i][1]===o.t){b.classList.add('done');selBtn.classList.remove('sel');selBtn.classList.add('done');selBtn=null;cur.sel=null;sfx.good();if(--cur.left===0)result(cur.miss<=1,cur.a)}
  else{cur.miss++;b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),350);sfx.bad()}
}
function timeout(){
  if(locked)return;locked=true;sfx.bad();
  $('msg').textContent="⏰ Time's up! Answer: "+cur.a;$('msg').style.color='#d62839';
  if(cur.t==='mc')[...$('opts').children].forEach(b=>{if(b.textContent===cur.a)b.classList.add('right')});
  setTimeout(nextQ,2600);
}
function finish(){
  show('end');
  const S=SUBJECTS[curSub],t=S.topics[curTopic];
  $('endt').textContent=S.icon+' '+S.name+' · '+t.name;$('final').textContent=score;
  const s=score>=9?3:score>=6?2:score>=3?1:0;sfx.end(s);
  $('stars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  $('trophy').textContent=s===3?'🏆':s===2?'🥈':s===1?'🥉':'🌱';
  $('comment').textContent=['Keep practicing, you can do it! 💪','Good try! 🙂','Great work! 👏','Amazing! You are a star! 🌟'][s];
}
if(location.hash&&SUBJECTS[location.hash.slice(1)])openSubject(location.hash.slice(1));
